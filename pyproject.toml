[project]
name = "open-arm-folding"
version = "0.1.0"
description = "OpenArm throw env, scripted expert, and VLA fine-tuning pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.14.0",
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "gymnasium>=0.29.0",
    "pyyaml>=6.0",
    "imageio>=2.34.0",
    "imageio-ffmpeg>=0.5.0",
    "pytest>=8.0",
    "matplotlib>=3.11.2",
    "torch>=2.11.0",
    "lerobot>=0.6.1",
]

[project.optional-dependencies]
train = [
    "torch",
    "torchvision",
    "lerobot[smolvla,dataset]==0.6.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openarm_vla"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

